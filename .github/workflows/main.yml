name: Build chan_quectel for OpenWrt 25

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'Direct Download URL of SDK (.tar.zst)'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get purge -y needrestart || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zstd wget file

      - name: Download & Extract OpenWrt SDK
        run: |
          echo "Downloading SDK..."
          wget -q "${{ github.event.inputs.sdk_url }}" -O sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst --strip-components=1 -C sdk

      - name: Download chan-quectel source & Asterisk headers
        run: |
          # Clone latest chan-quectel source
          git clone https://github.com/IchthysMaranatha/asterisk-chan-quectel.git src_quectel
          
          # Clone asterisk source for include headers
          git clone --depth 1 -b 20 https://github.com/asterisk/asterisk.git ast_src
          
          # Generate autoconfig.h required by asterisk headers
          cd ast_src
          ./configure --without-ssl --without-crypto --without-jansson || true

      - name: Compile chan_quectel.so
        run: |
          # Set STAGING_DIR to silence GCC warning and locate tools
          export STAGING_DIR="$(pwd)/sdk/staging_dir"
          TOOLCHAIN_BIN=$(find "$STAGING_DIR" -maxdepth 2 -type d -name "bin" | grep toolchain | head -n 1)
          export PATH="$TOOLCHAIN_BIN:$PATH"
          CROSS_CC=$(which mipsel-openwrt-linux-musl-gcc || which mipsel-openwrt-linux-gcc)
          
          echo "Using Compiler: $CROSS_CC"
          
          cd src_quectel
          
          # Compile chan_quectel.so with Asterisk include paths
          $CROSS_CC -O2 -pipe -mno-branch-likely -mips32r2 -mtune=24kc -fPIC -shared \
            -D_GNU_SOURCE \
            -I../ast_src/include \
            -I../ast_src/main \
            -I./ \
            chan_quectel.c \
            -o chan_quectel.so
            
          ls -lh chan_quectel.so
          file chan_quectel.so

      - name: Upload chan_quectel.so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chan_quectel-OpenWrt25-MT7621
          path: src_quectel/chan_quectel.so
