name: BuildIpk

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'OpenWrt SDK URL'
        required: true
        default: 'https://downloads.openwrt.org/releases/25.12.3/targets/ramips/mt7621/openwrt-sdk-25.12.3-ramips-mt7621_musl.Linux-x86_64.tar.xz'
      ast_version:
        description: 'Asterisk Version'
        required: true
        default: 'Ast20'
        type: choice
        options:
          - Ast16
          - Ast18
          - Ast20

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get purge -y needrestart || true
          sudo rm -rf /etc/needrestart /usr/lib/needrestart /etc/apt/apt.conf.d/*needrestart*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc \
            rsync wget unzip python3 file

      - name: Setup OpenWrt SDK and Build chan_quectel
        run: |
          SDK_URL="${{ github.event.inputs.sdk_url }}"
          
          echo "Downloading SDK from: $SDK_URL"
          wget -q "$SDK_URL" -O openwrt-sdk.tar.xz
          
          mkdir sdk
          tar -xf openwrt-sdk.tar.xz --strip-components=1 -C sdk
          cd sdk
          
          # Update feeds quietly
          ./scripts/feeds update -a > /dev/null 2>&1
          
          # Install required feeds
          ./scripts/feeds install ncurses libedit jansson libxml2 libopenssl alsa-lib libusb
          ./scripts/feeds install -p telephony asterisk
          
          # Setup chan-quectel package directory
          mkdir -p package/chan-quectel
          SRC_MAKEFILE=$(find ../openwrt/urlmakefile/ -name "Makefile" | head -n 1)
          if [ -n "$SRC_MAKEFILE" ]; then
            cp "$SRC_MAKEFILE" package/chan-quectel/Makefile
          else
            echo "Error: Makefile not found!"
            exit 1
          fi
          
          # Adapt dependencies for OpenWrt 23 / Asterisk 20
          sed -i 's/+asterisk[0-9]*/+asterisk/g' package/chan-quectel/Makefile
          sed -i 's/+libusb-1.0/+libusb/g' package/chan-quectel/Makefile
          
          # Configure SDK
          make defconfig
          echo "CONFIG_PACKAGE_libncurses=y" >> .config
          echo "CONFIG_PACKAGE_libedit=y" >> .config
          echo "CONFIG_PACKAGE_libusb=y" >> .config
          echo "CONFIG_PACKAGE_asterisk=m" >> .config
          echo "CONFIG_PACKAGE_chan-quectel=m" >> .config
          make defconfig
          
          # Build target libraries quietly (to avoid log truncation)
          echo "Compiling system prerequisites..."
          make package/ncurses/compile -j$(nproc) > /dev/null 2>&1 || true
          make package/feeds/packages/libedit/compile -j$(nproc) > /dev/null 2>&1 || true
          
          # Build Asterisk headers
          echo "Compiling Asterisk headers..."
          make package/feeds/telephony/asterisk/compile -j$(nproc) > /dev/null 2>&1 || true
          
          # Compile chan-quectel with verbose logging
          echo "Compiling chan-quectel..."
          make package/chan-quectel/compile V=s -j1

      - name: Prepare Artifacts
        run: |
          mkdir -p output_ipk
          find sdk/bin/ -type f -name "*quectel*.ipk" -exec cp {} output_ipk/ \;
          find sdk/build_dir/ -type f -name "chan_quectel.so" -exec cp {} output_ipk/ \;
          ls -la output_ipk/

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chan-quectel-OpenWrt23-MT7621
          path: output_ipk/
