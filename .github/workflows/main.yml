name: BuildIpk

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'OpenWrt SDK URL'
        required: true
        default: 'https://downloads.openwrt.org/releases/22.03.3/targets/ramips/mt7620/openwrt-sdk-22.03.3-ramips-mt7620_gcc-11.2.0_musl.Linux-x86_64.tar.xz'
      ast_version:
        description: 'Asterisk Version'
        required: true
        default: 'Ast18'
        type: choice
        options:
          - Ast16
          - Ast18
          - Ast20

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # Completely purge needrestart and its apt hooks
          sudo apt-get purge -y needrestart || true
          sudo rm -rf /etc/needrestart /usr/lib/needrestart /etc/apt/apt.conf.d/*needrestart*

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc \
            rsync wget unzip python3 file

      - name: Setup OpenWrt SDK and Build chan_quectel
        run: |
          SDK_URL="${{ github.event.inputs.sdk_url }}"
          AST_VER="${{ github.event.inputs.ast_version }}"
          
          echo "Downloading SDK from: $SDK_URL"
          wget -q "$SDK_URL" -O openwrt-sdk.tar.xz
          
          mkdir sdk
          tar -xf openwrt-sdk.tar.xz --strip-components=1 -C sdk
          cd sdk
          
          # Update and install feeds
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          
          # Setup chan-quectel package directory
          mkdir -p package/telephony/chan-quectel
          
          # Select makefile based on Asterisk version
          if [ -d "../openwrt/urlmakefile/$AST_VER" ]; then
            cp -r ../openwrt/urlmakefile/$AST_VER/* package/telephony/chan-quectel/
          elif [ -d "../openwrt/urlmakefile/current" ]; then
            cp -r ../openwrt/urlmakefile/current/* package/telephony/chan-quectel/
          fi
          
          # Configure and compile
          make defconfig
          make package/telephony/chan-quectel/compile V=s -j$(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir -p output_ipk
          find sdk/bin/ -type f -name "*quectel*.ipk" -exec cp {} output_ipk/ \;
          if [ -z "$(ls -A output_ipk)" ]; then
            echo "Searching for built .so files directly..."
            find sdk/build_dir/ -type f -name "chan_quectel.so" -exec cp {} output_ipk/ \;
          fi

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chan-quectel-${{ github.event.inputs.ast_version }}
          path: output_ipk/
